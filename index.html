<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiempo de asignación por caso</title>
 
data:,
 
<style>
:root{
--bg:#f7f8fa;
--card:#ffffff;
--text:#1a1d23;
--muted:#6b7280;
--border:#e5e7eb;
--accent:#3b5bdb;
--accent-light:#eef1fd;
--danger:#e03131;
--ok:#2f9e44;
--warn:#f08c00;
}
 
*{
box-sizing:border-box;
}
 
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
 
.wrap{
max-width:1150px;
margin:auto;
padding:24px 16px 60px;
}
 
.card{
background:white;
border:1px solid var(--border);
border-radius:12px;
padding:18px;
margin-bottom:18px;
}
 
h1{
margin:0 0 8px;
}
 
.sub{
color:var(--muted);
}
 
input,
select{
width:100%;
padding:8px 10px;
border:1px solid var(--border);
border-radius:8px;
}
 
button{
background:var(--accent);
color:white;
border:none;
border-radius:8px;
padding:10px 16px;
cursor:pointer;
}
 
.map-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}
 
.row-actions{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:15px;
}
 
.table-scroll{
overflow-x:auto;
}
 
table{
width:100%;
border-collapse:collapse;
}
 
th,
td{
border-bottom:1px solid var(--border);
padding:10px;
text-align:left;
}
 
.stat{
background:var(--accent-light);
padding:12px;
border-radius:10px;
}
 
.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}
 
.pill{
padding:4px 10px;
border-radius:999px;
font-size:.8rem;
font-weight:600;
}
 
.pill-danger{
background:#ffe3e3;
color:#c92a2a;
}
 
.pill-warn{
background:#fff4e6;
color:#e67700;
}
 
.pill-ok{
background:#ebfbee;
color:#2b8a3e;
}
</style>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
 
<script>
window.onerror = function(message, source, line, col, error){
console.error("ERROR GLOBAL:", {
message,
source,
line,
col,
error
});
};
 
window.addEventListener("load", () => {
if(typeof XLSX === "undefined"){
document.body.innerHTML = `
<div style="padding:30px;font-family:sans-serif">
<h2 style="color:red">
Error cargando la librería XLSX
</h2>
</div>
`;
}
});
 
function escapeHTML(str){
return String(str || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}
</script>
</head>
 
<body>
 
<div class="wrap">
 
<h1>Tiempo de asignación por caso</h1>
 
<p class="sub">
Sube el historial de Salesforce y calcula automáticamente el tiempo de asignación por caso.
</p>
 
<div class="card">
 
<h2>1. Cargar archivo</h2>
 
<input type="file" id="f-file" accept=".xlsx,.xls,.csv">
 
<div id="map-area" style="display:none;margin-top:20px;">
 
<div class="map-grid">
 
<div>
<label>Número del caso</label>
<select id="map-numcaso"></select>
</div>
 
<div>
<label>Modificado por</label>
<select id="map-modpor"></select>
</div>
 
<div>
<label>Campo / Evento</label>
<select id="map-campo"></select>
</div>
 
<div>
<label>Valor nuevo</label>
<select id="map-valnuevo"></select>
</div>
 
<div>
<label>Fecha modificación</label>
<select id="map-fechaevento"></select>
</div>
 
</div>
 
<div class="row-actions">
 
<div>
<label>Filtro evento</label>
<input id="f-keyword" value="propietario">
</div>
 
<div>
<label>Hora referencia</label>
<input id="f-ahora" type="datetime-local">
</div>
 
<div>
<label>Alerta horas</label>
<input id="f-horas" type="number" value="24">
</div>
 
<div>
<button id="btn-calc">
Calcular
</button>
</div>
 
</div>
 
</div>
 
</div>
 
<div class="card" id="results-card" style="display:none;">
<h2>Resultados</h2>
 
<div class="summary-grid" id="summary"></div>
</div>
 
<div class="card" id="table-card" style="display:none;">
 
<div style="margin-bottom:15px;">
<label>Asignado actualmente a</label>
<select id="filter-propietario">
<option value="">Todos</option>
</select>
</div>
 
<div class="table-scroll">
 
<table>
 
<thead>
<tr>
<th>Caso</th>
<th>Asignado a</th>
<th>Desde</th>
<th>Tiempo</th>
<th>Reasignaciones</th>
<th>Estado</th>
</tr>
</thead>
 
<tbody id="tbody"></tbody>
 
</table>
 
</div>
 
</div>
 
</div>
 
<script>
console.log("Aplicación cargada correctamente.");
</script>
 
</body>
</html>
